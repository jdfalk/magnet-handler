name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., v1.0.0)"
                required: true
                type: string

permissions:
    contents: write
    packages: write
    attestations: write
    id-token: write
    security-events: write

jobs:
    release:
        name: Build and Release
        uses: falkcorp/github-common/.github/workflows/reusable-release.yml@d0c3326b96557c8ea9117c1c196b628e5e028186 # v1.10.8
        with:
            build-target: "go"
            go-enabled: true
        secrets: inherit
